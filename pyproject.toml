[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-trading-system"
version = "1.0.0"
description = "Market Regime-Adaptive Multimodal Ensemble RL and Dual-Process Knowledge Distillation Trading System (PhD Thesis Empirical Pipeline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "torch>=2.1",
    "torchvision>=0.16",
    "gymnasium>=0.29",
    "shap>=0.45",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "networkx>=3.2",
    "transformers>=4.40",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
